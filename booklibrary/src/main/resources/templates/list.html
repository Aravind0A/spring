<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Product List</title>
</head>
<body>
<h1>Product List</h1>
<form action="#" th:action="@{/all}" method="get">
    <input type="text" name="keyword" placeholder="Search by name or description" />
    <input type="submit" value="Search" />
</form>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Author</th>
            <th>Title</th>
            <th>Published Date</th>
            <th>Price</th>
			<th>Description</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="book : ${book}">
            <td th:text="${book.id}"></td>
            <td th:text="${book.author}"></td>
            <td th:text="${book.title}"></td>
            <td th:text="${book.publishedDate}"></td>
            <td th:text="${book.price}"></td>
			<td th:text="${book.description}"></td>
            <td>
               
				<a th:href="@{/pdf/{id}(id=${book.id})}">Download Pdf</a>
            </td>
        </tr>
    </tbody>
</table>
</body>
</html>
