<!DOCTYPE html>
<html>
	<body>
		<h1>Product details</h1>
		<table border = "1">
			<thead>
				<tr>
					<th>ID</th>
					<th>Name</th>
					<th>Price</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each= "product,index : ${products}" th:if= "${index.index == 0}">
					<td th:text = "${product.id}"></td>
					<td th:text = "${product.name}"></td>
					<td th:text = "${product.price}"></td>
				</tr>
			</tbody>	
		</table>
					
	</body>
</html>
