<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Update Student</title>
</head>
<body>
<h1>Update Student</h1>
<form action="#" th:action="@{/update/{id}(id=${student.id})}" method="post">
    <label>Name:</label>
    <input type="text" name="name" th:value="${student.name}" required /><br/>
    <label>Class:</label>
    <input type="text" name="standard" th:value="${student.standard}" required /><br/>
    <label>Age:</label>
    <input type="text" name="age" th:value="${student.age}" required /><br/>
   
    <input type="submit" value="Update" />
</form>
</body>
</html>
