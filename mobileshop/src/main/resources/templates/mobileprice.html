<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Products</title>
</head>
<body>
    <h1>Mobile by Prices</h1>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="mobile : ${nameandprice}">
                <td th:text="${mobile.name}"></td>
                <td th:text="${mobile.price}"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
